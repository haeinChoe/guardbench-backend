spring:
  application:
    name: guardbench-backend
  docker:
    compose:
      file: compose.yaml
      lifecycle-management: start-and-stop
      skip:
        in-tests: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    fail-on-missing-locations: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      # 알 수 없는 Request Body 필드는 무시하지 않고 VALIDATION_ERROR로 거부한다.
      fail-on-unknown-properties: true

# SQS 런타임 설정 (DefaultCredentialsProvider 체인 사용, Spring Cloud AWS 없음)
# SQS 빈 활성화: guardbench.sqs.enabled=true일 때만 SqsClient를 생성한다.
guardbench:
  test-case-bulk-idempotency:
    cleanup:
      enabled: ${GUARDBENCH_TEST_CASE_BULK_IDEMPOTENCY_CLEANUP_ENABLED:true}
      # 각 batch를 별도 트랜잭션으로 삭제해 row lock, WAL, vacuum 부하를 제한한다.
      batch-size: ${GUARDBENCH_TEST_CASE_BULK_IDEMPOTENCY_CLEANUP_BATCH_SIZE:500}
      max-batches-per-run: ${GUARDBENCH_TEST_CASE_BULK_IDEMPOTENCY_CLEANUP_MAX_BATCHES_PER_RUN:10}
      delay-ms: ${GUARDBENCH_TEST_CASE_BULK_IDEMPOTENCY_CLEANUP_DELAY_MS:900000}
      initial-delay-ms: ${GUARDBENCH_TEST_CASE_BULK_IDEMPOTENCY_CLEANUP_INITIAL_DELAY_MS:60000}
  sqs:
    enabled: ${SQS_ENABLED:false}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint-override: ${SQS_ENDPOINT_OVERRIDE:}
    polling:
      max-messages: 10
      wait-time-seconds: 20
      # SQS queue default and ReceiveMessage override must stay aligned with
      # the 45s Backend claim lease and its processing buffer.
      visibility-timeout-seconds: 90
    outbox:
      # 발행 트랜잭션이 PENDING row lock을 SQS 전송 동안 유지하므로 batch는 작게 유지한다.
      batch-size: 10
      delay-ms: 1000
  worker:
    enabled: ${WORKER_ENABLED:false}
    work-items:
      concurrency: ${GUARDBENCH_WORKER_WORK_ITEMS_CONCURRENCY:1}
      shutdown-timeout-seconds: ${GUARDBENCH_WORKER_WORK_ITEMS_SHUTDOWN_TIMEOUT_SECONDS:30}
  # HTTP Application Target 호출 한도와 SSRF 방어 정책
  http-endpoint:
    connect-timeout-ms: 5000
    request-timeout-ms: 15000
    max-response-bytes: 1048576
    # 운영 기본값은 loopback/private/link-local/multicast 주소를 차단한다.
    allow-private-addresses: false
    # 성능 환경의 승인된 internal ALB hostname만 정확히 일치시켜 private 주소를 허용한다.
    # 와일드카드와 private IP literal은 허용하지 않는다.
    allowed-private-hostnames: []
  # SageMaker Runtime Provider 호출 한도 (ADR 0005: 재시도 포함 전체 15초, claim lease 45초 미만)
  # 실측 latency(P95 200ms 이하)는 15초 한도보다 훨씬 낮아 충분한 마진을 갖는다.
  # max-attempts는 1(재시도 없음)로 고정한다. Provider business retry(PROVIDER_UNAVAILABLE/
  # PROVIDER_TIMEOUT)는 Worker claim retry(ExecuteTestRunService.MAX_EXECUTION_ATTEMPTS, 최대
  # 3회) 한 계층에만 위임하며, SDK 자체 재시도까지 함께 켜면 실제 호출 횟수가 두 값의 곱으로
  # 증폭된다.
  sagemaker:
    region: ${AWS_REGION:ap-northeast-2}
    endpoint-override: ${SAGEMAKER_ENDPOINT_OVERRIDE:}
    api-call-timeout-ms: 15000
    api-call-attempt-timeout-ms: 5000
    max-attempts: 1
    # Response Behavior Classifier (#173): 최종 endpoint name/system prompt는 별도 실험으로 확정
    # 전이며 이 값은 배포 시 주입하는 placeholder다. endpoint-name을 비워두면 애플리케이션은 정상
    # 기동하지만 classifier를 실제로 사용하는 시점(TestRun 접수, Worker evaluate 호출)에 실패한다.
    classifier:
      # 실험에서 사용한 이름 예시: guardbench-qwen3-4b-endpoint (검증 후 삭제됨, 고정값 아님)
      endpoint-name: ${SAGEMAKER_CLASSIFIER_ENDPOINT_NAME:}
      # classifier system prompt(v1)는 별도 실험 결과 값이며 이 리포지토리에는 원문을 포함하지 않는다.
      system-prompt: ${SAGEMAKER_CLASSIFIER_SYSTEM_PROMPT:}
      # user-prompt-template을 비워두면 이슈 #173이 명시한 기본 형식(USER REQUEST / ASSISTANT RESPONSE)을 사용한다.
      user-prompt-template: ${SAGEMAKER_CLASSIFIER_USER_PROMPT_TEMPLATE:}
