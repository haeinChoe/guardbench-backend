services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-guardbench}
      POSTGRES_USER: ${DB_USERNAME:-guardbench}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME:-guardbench} -d ${DB_NAME:-guardbench}
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - guardbench-postgres-data:/var/lib/postgresql/data

volumes:
  guardbench-postgres-data:
