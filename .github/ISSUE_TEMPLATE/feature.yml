name: Feature
description: 승인 가능한 요구사항과 완료 조건으로 기능 작업을 정의합니다.
title: "[Feature] "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        결론부터 간결하게 씁니다. DRAFT나 미결정에 따라 공개 동작이 달라지면 구현 전에 먼저 결정합니다.

  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 누구에게 어떤 결과를 제공하며 왜 필요한지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: contracts
    attributes:
      label: 관련 GitHub 계약
      description: docs/README.md에서 확인한 문서 경로와 상태(APPROVED/DRAFT)를 적습니다. 해당 없으면 이유를 적습니다.
      placeholder: |
        - docs/domain/core-model.md (APPROVED)
        - docs/api/openapi.yaml (APPROVED)
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 구현 범위
      description: 변경을 허용하는 유스케이스, 계층, 엔드포인트 또는 파일을 구체적으로 적어주세요.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: 이번 Issue에서 구현하지 않을 인접 기능이나 리팩터링을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건과 검증
      description: 관찰 가능한 결과와 실행할 테스트를 체크리스트로 작성해 주세요.
      placeholder: |
        - [ ] 유효한 요청은 HTTP 201과 계약된 응답을 반환한다.
        - [ ] 관련 단위 테스트와 통합 테스트가 통과한다.
    validations:
      required: true

  - type: textarea
    id: contract_impact
    attributes:
      label: 계약과 아키텍처 영향
      description: 공개 API, 도메인, DB, production 의존성, 아키텍처별 변경 여부와 승인 근거를 적어주세요.
      placeholder: |
        - 공개 API: 없음
        - 도메인: 없음
        - DB: 있음 — 승인 근거: #123 / ADR 링크
        - production 의존성: 없음
        - 아키텍처: 없음
    validations:
      required: true

  - type: textarea
    id: open_questions
    attributes:
      label: 미결정 사항과 의존 작업
      description: 구현 전 결정 사항과 선행 Issue를 적습니다. 없으면 "없음"으로 작성합니다.
    validations:
      required: true

  - type: input
    id: branch_slug
    attributes:
      label: 브랜치 slug
      description: Issue 생성 후 agent/{issue-number}-{slug} 브랜치와 전용 worktree에 사용합니다.
      placeholder: create-test-suite
    validations:
      required: true

  - type: dropdown
    id: agent_permission
    attributes:
      label: 에이전트 작업 범위
      description: Issue 자체는 push, PR 생성, 병합 또는 force push 권한을 부여하지 않습니다.
      options:
        - 검증된 로컬 커밋까지 허용
        - 파일 수정과 검증까지 허용 — 커밋 금지
        - 조사와 진단만 허용 — 파일 변경 금지
    validations:
      required: true

  - type: checkboxes
    id: ready
    attributes:
      label: 구현 준비 확인
      options:
        - label: 완료 조건은 구체적이며 DRAFT·미결정이나 미승인 계약 변경을 구현 근거로 사용하지 않습니다.
          required: true
