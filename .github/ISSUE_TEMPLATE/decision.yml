name: Decision
description: 구현 전에 필요한 설계 결정과 승인 근거를 준비합니다.
title: "[Decision] "
labels:
  - decision
body:
  - type: markdown
    attributes:
      value: |
        결론부터 간결하게 씁니다. 제안은 승인된 계약이나 구현 권한이 아니며, 승인된 결정은 ADR로 남깁니다.

  - type: textarea
    id: context
    attributes:
      label: 배경과 문제
      description: 어떤 문제와 제약 때문에 지금 결정이 필요한지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: contracts
    attributes:
      label: 관련 계약과 선행 결정
      description: GitHub 문서 경로와 상태(APPROVED/DRAFT), ADR, Issue/PR을 적고 Notion은 참고 링크로 구분합니다.
    validations:
      required: true

  - type: textarea
    id: drivers
    attributes:
      label: 결정 기준과 제약
      description: 보안, 호환성, 운영 복잡도, 비용과 일정 등 선택지를 평가할 기준을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: 선택지와 장단점
      description: 현실적인 대안을 둘 이상 비교하고, 가능하면 아무것도 바꾸지 않는 선택도 포함합니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안과 근거
      description: 권장 선택, 범위, Non-Goals와 핵심 근거를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향, 검증과 되돌리기
      description: 계약·운영 영향, 성공 기준, 실패 신호와 되돌리기 방법을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: open_questions
    attributes:
      label: 미결정 사항과 필요한 승인자
      description: 추가 조사, 의존 결정, 결정권자와 목표 시점을 적습니다. 없으면 "없음"으로 작성합니다.
    validations:
      required: true

  - type: input
    id: branch_slug
    attributes:
      label: ADR 브랜치 slug
      description: 승인 후 agent/{issue-number}-{slug} 브랜치와 전용 worktree에 사용합니다.
      placeholder: choose-persistence-strategy
    validations:
      required: true

  - type: checkboxes
    id: decision_boundary
    attributes:
      label: 결정 경계 확인
      options:
        - label: 승인 전에는 확정 계약으로 사용하지 않고, 승인 후 ADR과 별도 구현 Issue로 추적합니다.
          required: true
