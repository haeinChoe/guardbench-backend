name: Bug
description: 재현 가능한 오류, 영향 범위와 회귀 방지 조건을 기록합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        비밀 정보, 자격 증명, 개인정보와 운영 데이터는 첨부하지 마세요.
        보안 취약점은 공개 Issue에 상세 내용을 남기기 전에 비공개 보고 경로를 확인해 주세요.

  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 실제 동작이 어떤 계약이나 기대와 다른지 설명해 주세요.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 영향도
      options:
        - Critical — 핵심 흐름을 사용할 수 없음
        - High — 주요 기능 실패, 우회가 없거나 어려움
        - Medium — 일부 기능 실패, 제한적인 우회가 있음
        - Low — 경미한 오류 또는 사용성 문제
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 발생 환경
      description: 브랜치/커밋, 실행 환경, 설정과 입력 조건을 적습니다. 비밀 값은 제외합니다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 가능하면 근거가 되는 APPROVED 계약이나 테스트를 연결해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작과 증거
      description: 최소 로그, 오류 메시지 또는 응답을 첨부하되 민감 정보는 제거합니다.
    validations:
      required: true

  - type: textarea
    id: contracts
    attributes:
      label: 관련 계약과 참고 자료
      description: 계약 경로와 상태를 먼저 쓰고 관련 Issue/PR/Notion을 덧붙입니다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 수정 범위
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: 함께 수행하지 않을 리팩터링이나 인접 기능을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건과 회귀 테스트
      placeholder: |
        - [ ] 최소 재현 테스트가 수정 전 실패하고 수정 후 통과한다.
        - [ ] 기존 정상 경로 테스트가 통과한다.
    validations:
      required: true

  - type: textarea
    id: contract_impact
    attributes:
      label: 계약과 아키텍처 영향
      description: 공개 API, 도메인, DB, production 의존성, 아키텍처 변경 여부를 적습니다. 계약 변경은 별도 승인이 필요합니다.
    validations:
      required: true

  - type: input
    id: branch_slug
    attributes:
      label: 브랜치 slug
      description: Issue 생성 후 agent/{issue-number}-{slug} 브랜치와 전용 worktree에 사용합니다.
      placeholder: fix-test-run-status
    validations:
      required: true

  - type: dropdown
    id: agent_permission
    attributes:
      label: 에이전트 작업 범위
      description: Issue 자체는 push, PR 생성, 병합 또는 force push 권한을 부여하지 않습니다.
      options:
        - 검증된 로컬 커밋까지 허용
        - 파일 수정과 검증까지 허용 — 커밋 금지
        - 조사와 진단만 허용 — 파일 변경 금지
    validations:
      required: true

  - type: checkboxes
    id: ready
    attributes:
      label: 조사 준비 확인
      options:
        - label: 재현 정보에서 비밀 정보와 운영 데이터를 제거했습니다.
          required: true
        - label: 검증 가능한 완료 조건을 작성했고 계약 변경은 별도 승인받습니다.
          required: true
