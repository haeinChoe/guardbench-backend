name: Performance analysis bundle

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Performance run id stored under performance/results/<run-id>/.
        required: true
        type: string
      results_bucket:
        description: S3 bucket that stores Performance Runner results.
        required: true
        default: guardbench-dev-performance-results-508139322599
        type: string
      log_group:
        description: CloudWatch Logs group for the Performance Backend.
        required: true
        default: /ecs/guardbench-dev/performance-app
        type: string

permissions:
  contents: read

concurrency:
  group: performance-analysis-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: performance
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      RUN_ID: ${{ inputs.run_id }}
      RESULTS_BUCKET: ${{ inputs.results_bucket }}
      LOG_GROUP: ${{ inputs.log_group }}
    steps:
      - name: Validate inputs and AWS configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUN_ID"
          test -n "$RESULTS_BUCKET"
          test -n "$LOG_GROUP"
          test -n "$AWS_REGION"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          [[ "$RUN_ID" =~ ^[A-Za-z0-9._-]+$ ]]

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download canonical Runner results from S3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/runner bundle/logs
          prefix="s3://${RESULTS_BUCKET}/performance/results/${RUN_ID}/"
          aws s3 cp "$prefix" bundle/runner/ --recursive
          for name in result.json report.md k6-summary.json aws-metrics.json; do
            test -s "bundle/runner/${name}"
          done
          echo "Downloaded ${prefix}" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve CloudWatch query window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(jq -er '.started_at' bundle/runner/result.json)"
          finished_at="$(jq -er '.finished_at' bundle/runner/result.json)"
          start_epoch="$(( $(date -u -d "$started_at" +%s) - 30 ))"
          end_epoch="$(( $(date -u -d "$finished_at" +%s) + 30 ))"
          test "$end_epoch" -gt "$start_epoch"
          echo "start_epoch=${start_epoch}" >> "$GITHUB_OUTPUT"
          echo "end_epoch=${end_epoch}" >> "$GITHUB_OUTPUT"
          {
            echo "### Performance analysis bundle"
            echo "- Run ID: ${RUN_ID}"
            echo "- S3 bucket: ${RESULTS_BUCKET}"
            echo "- Log group: ${LOG_GROUP}"
            echo "- Runner window: ${started_at} ~ ${finished_at}"
            echo "- Logs query window: ${start_epoch} ~ ${end_epoch} (UTC epoch, ±30s buffer)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect CloudWatch Logs Insights diagnostics
        shell: bash
        env:
          START_EPOCH: ${{ steps.window.outputs.start_epoch }}
          END_EPOCH: ${{ steps.window.outputs.end_epoch }}
        run: |
          set -euo pipefail

          run_query() {
            local name="$1"
            local query="$2"
            local query_id status
            query_id="$(aws logs start-query \
              --log-group-name "$LOG_GROUP" \
              --start-time "$START_EPOCH" \
              --end-time "$END_EPOCH" \
              --query-string "$query" \
              --query queryId \
              --output text)"
            test -n "$query_id"

            for _ in $(seq 1 60); do
              aws logs get-query-results --query-id "$query_id" > "bundle/logs/${name}.json"
              status="$(jq -r '.status' "bundle/logs/${name}.json")"
              case "$status" in
                Complete) return 0 ;;
                Failed|Cancelled|Timeout|Unknown)
                  echo "Logs Insights query ${name} ended with status ${status}" >&2
                  return 1
                  ;;
              esac
              sleep 2
            done
            echo "Logs Insights query ${name} did not complete in time" >&2
            return 1
          }

          run_query test-run-candidates 'fields @timestamp, @message | filter @message like /TestRun을 접수했습니다/ | parse @message /testRunId=(?<testRunId>[0-9]+)/ | stats count(*) as logCount by testRunId | sort testRunId asc'

          mapfile -t test_run_ids < <(jq -r '
            .results[]
            | map(select(.field == "testRunId"))[0].value // empty
          ' bundle/logs/test-run-candidates.json | sort -u)

          if [[ "${#test_run_ids[@]}" -eq 1 ]]; then
            test_run_id="${test_run_ids[0]}"
            filter="and @message like /testRunId=${test_run_id}\\b/"
            echo "${test_run_id}" > bundle/logs/test-run-id.txt
            echo "- Discovered TestRun ID: ${test_run_id}" >> "$GITHUB_STEP_SUMMARY"
          else
            test_run_id=""
            filter=""
            printf '%s\n' "${test_run_ids[@]}" > bundle/logs/test-run-id-candidates.txt
            echo "::warning::Expected one TestRun in the isolated Performance window but found ${#test_run_ids[@]}; collecting time-window diagnostics without a TestRun filter."
            echo "- Discovered TestRun IDs: ${test_run_ids[*]:-(none)}" >> "$GITHUB_STEP_SUMMARY"
          fi

          run_query execution-timeline "fields @timestamp, @message | filter (@message like /WorkItem 수신 timing을 기록합니다/ or @message like /SQS 메시지 처리를 시작합니다/ or @message like /Application Target 호출/ or @message like /Application response 진단 정보를 기록합니다/ or @message like /Classifier 호출을 시작합니다/ or @message like /Classifier 판정을 완료했습니다/ or @message like /Classifier 판정에 실패했습니다/ or @message like /실패로 재시도합니다/ or @message like /terminal 결과를 저장했습니다/ or @message like /finalization을 완료했습니다/) ${filter} | sort @timestamp asc"

          run_query queue-wait "fields @timestamp | filter @message like /WorkItem 수신 timing을 기록합니다/ ${filter} | parse @message /snapshotId=(?<snapshotId>[0-9]+)/ | parse @message /eventId=(?<eventId>[^ ]+)/ | parse @message /messageId=(?<messageId>[^ ]+)/ | parse @message /receivedAt=(?<receivedAt>[^ ]+)/ | parse @message /sentTimestamp=(?<sentTimestamp>[^ ]+)/ | parse @message /queueWaitMs=(?<queueWaitMs>[^ ]+)/ | display @timestamp, snapshotId, eventId, messageId, receivedAt, sentTimestamp, queueWaitMs | sort @timestamp asc"

          run_query worker-concurrency "fields @timestamp | filter @message like /SQS 메시지 처리를 시작합니다/ ${filter} | parse @message /snapshotId=(?<snapshotId>[0-9]+)/ | parse @message /workerDispatchWaitMs=(?<workerDispatchWaitMs>[^ ]+)/ | parse @message /configuredConcurrency=(?<configuredConcurrency>[^ ]+)/ | parse @message /currentInFlight=(?<currentInFlight>[^ ]+)/ | filter configuredConcurrency != 'null' | display @timestamp, snapshotId, workerDispatchWaitMs, configuredConcurrency, currentInFlight | sort @timestamp asc"

          run_query target-latency "fields @timestamp | filter (@message like /Application Target 호출을 완료했습니다/ or @message like /Application Target 호출에 실패했습니다/) ${filter} | parse @message /snapshotId=(?<snapshotId>[0-9]+)/ | parse @message /attemptCount=(?<attemptCount>[0-9]+)/ | parse @message /durationMs=(?<durationMs>[0-9]+)/ | parse @message /errorStage=(?<errorStage>[^ ]+)/ | parse @message /errorCode=(?<errorCode>[^ ]+)/ | display @timestamp, snapshotId, attemptCount, durationMs, errorStage, errorCode | sort @timestamp asc"

          run_query classifier-timeline "fields @timestamp, @message | filter (@message like /Classifier 호출을 시작합니다/ or @message like /Classifier 판정을 완료했습니다/ or @message like /Classifier 판정에 실패했습니다/) ${filter} | parse @message /snapshotId=(?<snapshotId>[0-9]+)/ | parse @message /attemptCount=(?<attemptCount>[0-9]+)/ | display @timestamp, snapshotId, attemptCount, @message | sort @timestamp asc"

          run_query retries-and-terminal "fields @timestamp, @message | filter (@message like /실패로 재시도합니다/ or @message like /terminal 결과를 저장했습니다/) ${filter} | parse @message /snapshotId=(?<snapshotId>[0-9]+)/ | parse @message /attemptCount=(?<attemptCount>[0-9]+)/ | parse @message /errorStage=(?<errorStage>[^ ]+)/ | parse @message /errorCode=(?<errorCode>[^ ]+)/ | display @timestamp, snapshotId, attemptCount, errorStage, errorCode, @message | sort @timestamp asc"

          jq -n \
            --arg runId "$RUN_ID" \
            --arg bucket "$RESULTS_BUCKET" \
            --arg logGroup "$LOG_GROUP" \
            --arg testRunId "$test_run_id" \
            --argjson startEpoch "$START_EPOCH" \
            --argjson endEpoch "$END_EPOCH" \
            '{run_id:$runId, results_bucket:$bucket, log_group:$logGroup, test_run_id:($testRunId | if length == 0 then null else . end), query_window:{start_epoch:$startEpoch,end_epoch:$endEpoch}}' \
            > bundle/bundle-metadata.json

      - name: Upload analysis bundle
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ inputs.run_id }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize bundle contents
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "- Artifact: perf-${RUN_ID}"
            echo "- Runner files: $(find bundle/runner -maxdepth 1 -type f | wc -l)"
            echo "- Logs diagnostics: $(find bundle/logs -maxdepth 1 -type f | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
