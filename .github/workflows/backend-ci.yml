name: Backend CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Select the ECS environment to deploy.
        required: true
        default: dev
        type: choice
        options:
          - dev
          - performance
      deployment_mode:
        description: Select whether to deploy the current source revision or only refresh infrastructure configuration.
        required: true
        default: infrastructure
        type: choice
        options:
          - infrastructure
          - source

permissions:
  contents: read

jobs:
  changes:
    name: detect verification scope
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    outputs:
      application_source: ${{ steps.scope.outputs.application_source }}
      verification_required: ${{ steps.scope.outputs.verification_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect verification scope
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE" =~ ^0+$ ]] || ! git diff --quiet "$BASE" "$HEAD" -- src/; then
            echo 'application_source=true' >> "$GITHUB_OUTPUT"
          else
            echo 'application_source=false' >> "$GITHUB_OUTPUT"
          fi

          if [[ "$BASE" =~ ^0+$ ]] || ! git diff --quiet "$BASE" "$HEAD" -- \
            src/ build.gradle settings.gradle gradle/ gradlew gradlew.bat qodana.yaml .github/workflows/backend-ci.yml; then
            echo 'verification_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'verification_required=false' >> "$GITHUB_OUTPUT"
          fi

  workflow_tests:
    name: workflow tests
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ECS deployment verification
        shell: bash
        run: bash scripts/test-verify-ecs-deployment.sh

  test_fast:
    name: testFast
    needs: changes
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'source') ||
        (github.event_name != 'workflow_dispatch' &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.verification_required == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run testFast
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          ./gradlew clean testFast --no-daemon
          elapsed=$(( $(date +%s) - started_at ))
          {
            echo "### testFast"
            echo "- Gradle dependency cache hit: ${{ steps.java.outputs.cache-hit }}"
            echo "- Elapsed seconds: ${elapsed}"
          } >> "$GITHUB_STEP_SUMMARY"

  integration_test:
    name: integrationTest
    needs: changes
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'source') ||
        (github.event_name != 'workflow_dispatch' &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.verification_required == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Record Docker/Testcontainers environment
        shell: bash
        run: |
          set -euo pipefail
          docker info --format 'Docker server: {{.ServerVersion}}' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Docker images available before tests: $(docker images -q | wc -l)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run integrationTest
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          ./gradlew clean integrationTest --no-daemon
          elapsed=$(( $(date +%s) - started_at ))
          {
            echo "### integrationTest"
            echo "- Gradle dependency cache hit: ${{ steps.java.outputs.cache-hit }}"
            echo "- Elapsed seconds, including Testcontainers image preparation: ${elapsed}"
            echo "- Docker images available after tests: $(docker images -q | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: bootJar
    needs: changes
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'source') ||
        (github.event_name != 'workflow_dispatch' &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.verification_required == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build executable JAR
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          ./gradlew clean bootJar --no-daemon
          elapsed=$(( $(date +%s) - started_at ))
          {
            echo "### bootJar"
            echo "- Gradle dependency cache hit: ${{ steps.java.outputs.cache-hit }}"
            echo "- Elapsed seconds: ${elapsed}"
          } >> "$GITHUB_STEP_SUMMARY"

  qodana:
    name: Qodana PR changes
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.verification_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run Qodana for PR changes
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --linter qodana-jvm-community --within-docker true
          pr-mode: true
          post-pr-comment: false
          use-annotations: false
          upload-result: true
      - name: Summarize Qodana PR findings
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/qodana/results/qodana.sarif.json"
          test -s "$report"
          findings="$(jq '[.runs[]?.results[]?] | length' "$report")"
          types="$(jq -r '
            [
              .runs[] as $run | $run.results[]? |
              {
                id: (.ruleId // "unknown"),
                name: (
                  (if (.ruleIndex | type) == "number" then
                    $run.tool.driver.rules[.ruleIndex].shortDescription.text
                  else null end)
                  // .ruleId // "unknown"
                )
              }
            ]
            | group_by(.id)
            | map({name: .[0].name, count: length})
            | sort_by(-.count, .name)
            | .[:10][]
            | "- \(.name): \(.count)"
          ' "$report")"
          {
            echo '### Qodana JVM Community — PR changes'
            echo '- Mode: pull-request incremental analysis'
            echo "- Findings in changed files: ${findings}"
            echo '- Most frequent finding types:'
            if [[ -n "$types" ]]; then
              echo "$types"
            else
              echo '  - none'
            fi
            echo '- Detailed SARIF/HTML report: `qodana-report` workflow artifact'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  spotbugs:
    name: SpotBugs PR changed classes
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.verification_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Resolve changed Java classes
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE" "$HEAD" -- src/main/java src/test/java               | grep -E '^src/(main|test)/java/.+\.java$' || true
          )

          main_classes=()
          test_classes=()

          for file in "${files[@]}"; do
            case "${file##*/}" in
              package-info.java|module-info.java)
                continue
                ;;
            esac

            if [[ "$file" == src/main/java/* ]]; then
              class_name="${file#src/main/java/}"
              class_name="${class_name%.java}"
              class_name="${class_name//\//.}"
              main_classes+=("${class_name}*")
            elif [[ "$file" == src/test/java/* ]]; then
              class_name="${file#src/test/java/}"
              class_name="${class_name%.java}"
              class_name="${class_name//\//.}"
              test_classes+=("${class_name}*")
            fi
          done

          join_by_comma() {
            local IFS=,
            echo "$*"
          }

          main_filter="$(join_by_comma "${main_classes[@]}")"
          test_filter="$(join_by_comma "${test_classes[@]}")"
          main_count="${#main_classes[@]}"
          test_count="${#test_classes[@]}"
          total_count="$((main_count + test_count))"

          {
            echo "main_filter=${main_filter}"
            echo "test_filter=${test_filter}"
            echo "main_count=${main_count}"
            echo "test_count=${test_count}"
            echo "total_count=${total_count}"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### SpotBugs PR scope'
            echo "- Changed main classes: ${main_count}"
            echo "- Changed test classes: ${test_count}"
            echo "- Total changed Java classes: ${total_count}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run SpotBugs for changed classes
        if: steps.changed.outputs.total_count != '0'
        env:
          SPOTBUGS_MAIN_ONLY_ANALYZE: ${{ steps.changed.outputs.main_filter }}
          SPOTBUGS_TEST_ONLY_ANALYZE: ${{ steps.changed.outputs.test_filter }}
          MAIN_COUNT: ${{ steps.changed.outputs.main_count }}
          TEST_COUNT: ${{ steps.changed.outputs.test_count }}
        shell: bash
        run: |
          set -euo pipefail
          tasks=()
          if [[ "$MAIN_COUNT" != "0" ]]; then
            tasks+=(spotbugsMain)
          fi
          if [[ "$TEST_COUNT" != "0" ]]; then
            tasks+=(spotbugsTest)
          fi
          ./gradlew "${tasks[@]}" --no-daemon

      - name: Summarize SpotBugs PR findings
        if: always()
        env:
          MAIN_COUNT: ${{ steps.changed.outputs.main_count }}
          TEST_COUNT: ${{ steps.changed.outputs.test_count }}
          TOTAL_COUNT: ${{ steps.changed.outputs.total_count }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree
          import os

          main_count = int(os.environ.get('MAIN_COUNT') or 0)
          test_count = int(os.environ.get('TEST_COUNT') or 0)
          total_count = int(os.environ.get('TOTAL_COUNT') or 0)

          print('### SpotBugs — PR changed classes')
          print('- Mode: changed-class analysis via onlyAnalyze')
          print(f'- Changed main classes: {main_count}')
          print(f'- Changed test classes: {test_count}')

          if total_count == 0:
              print('- No changed Java classes; SpotBugs analysis skipped without falling back to a full scan.')
              raise SystemExit(0)

          reports = sorted(Path('build/reports/spotbugs').rglob('*.xml'))
          if not reports:
              raise SystemExit('SpotBugs was requested but produced no XML reports')

          finding_types = Counter()
          total_findings = 0
          for report in reports:
              bug_instances = list(ElementTree.parse(report).iter('BugInstance'))
              count = len(bug_instances)
              total_findings += count
              print(f'- {report}: {count} findings')
              for bug in bug_instances:
                  bug_type = bug.get('type', 'UNKNOWN')
                  short_message = (bug.findtext('ShortMessage') or '').strip()
                  label = f'{bug_type}: {short_message}' if short_message else bug_type
                  finding_types[label] += 1

          print(f'- Findings in analyzed changed classes: {total_findings}')
          print('- Most frequent finding types:')
          if finding_types:
              for label, count in finding_types.most_common(10):
                  print(f'  - {label}: {count}')
          else:
              print('  - none')
          print('- Detailed HTML/XML reports: `spotbugs-reports` workflow artifact')
          PY

      - name: Upload SpotBugs PR reports
        if: steps.changed.outputs.total_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: build/reports/spotbugs/
          if-no-files-found: error
          retention-days: 14

  verify:
    name: verify
    needs: [changes, test_fast, integration_test, package]
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'source') ||
        (github.event_name != 'workflow_dispatch' &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.verification_required == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to pass
        env:
          TEST_FAST_RESULT: ${{ needs.test_fast.result }}
          INTEGRATION_TEST_RESULT: ${{ needs.integration_test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          test "$TEST_FAST_RESULT" = success
          test "$INTEGRATION_TEST_RESULT" = success
          test "$PACKAGE_RESULT" = success
          {
            echo "### verification aggregate"
            echo "- testFast: ${TEST_FAST_RESULT}"
            echo "- integrationTest: ${INTEGRATION_TEST_RESULT}"
            echo "- bootJar: ${PACKAGE_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_target || 'dev' }}
    needs: [verify, changes]
    if: >-
      always() &&
      (
        needs.verify.result == 'success' ||
        (github.event_name == 'workflow_dispatch' &&
        inputs.deployment_mode == 'infrastructure' &&
        needs.verify.result == 'skipped')
      ) &&
      github.ref == 'refs/heads/dev' &&
      (
        (github.event_name == 'push' && needs.changes.outputs.application_source == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_target || 'dev' }}
    concurrency:
      group: guardbench-${{ github.event_name == 'workflow_dispatch' && inputs.deployment_target || 'dev' }}-application-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
      ECS_TASK_DEFINITION_FAMILY: ${{ vars.ECS_TASK_DEFINITION_FAMILY }}
      IMAGE_TAG: ${{ github.sha }}
      DEPLOYMENT_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_target || 'dev' }}
      DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'source' && 'manual-source' || github.event_name == 'workflow_dispatch' && 'manual-infrastructure' || 'automatic-source' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate deployment target configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_TARGET" in
            dev|performance) ;;
            *) echo "Unsupported deployment target: ${DEPLOYMENT_TARGET}" >&2; exit 1 ;;
          esac
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_REGION"
          test -n "$ECR_REPOSITORY"
          test -n "$ECS_CLUSTER"
          test -n "$ECS_SERVICE"
          test -n "$ECS_CONTAINER_NAME"
          test -n "$ECS_TASK_DEFINITION_FAMILY"
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve source deployment image
        id: source-image
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'source')
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          image_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "uri=${image_uri}" >> "$GITHUB_OUTPUT"
          echo "Deploying commit ${IMAGE_TAG} as ${image_uri}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and push image when the commit tag is new
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'source')
        env:
          IMAGE_URI: ${{ steps.source-image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          tag_mutability="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].imageTagMutability' \
            --output text)"
          test "$tag_mutability" = "IMMUTABLE"

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Reusing immutable ECR image ${IMAGE_URI}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin \
              "$(cut -d/ -f1 <<< "$IMAGE_URI")"
          ./gradlew bootBuildImage --imageName="$IMAGE_URI" --no-daemon
          docker push "$IMAGE_URI"
          echo "Pushed immutable ECR image ${IMAGE_URI}" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve current service application image for manual deployment
        id: manual-image
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'infrastructure'
        shell: bash
        run: |
          set -euo pipefail
          current_service_task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          test -n "$current_service_task_definition"
          test "$current_service_task_definition" != "None"

          aws ecs describe-task-definition \
            --task-definition "$current_service_task_definition" \
            --query taskDefinition \
            --output json > current-service-task-definition.json

          current_image_count="$(jq --arg name "$ECS_CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $name)] | length' \
            current-service-task-definition.json)"
          test "$current_image_count" = "1"

          current_image="$(jq -r --arg name "$ECS_CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $name) | .image' \
            current-service-task-definition.json)"
          test -n "$current_image"
          test "$current_image" != "null"

          echo "uri=${current_image}" >> "$GITHUB_OUTPUT"
          echo "Manual infrastructure deployment keeps the current service image ${current_image}" >> "$GITHUB_STEP_SUMMARY"
      - name: Register revision from the latest active task definition
        id: task-definition
        env:
          IMAGE_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'infrastructure' && steps.manual-image.outputs.uri || steps.source-image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          service_count="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'length(services)' \
            --output text)"
          test "$service_count" = "1"

          service_task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          test -n "$service_task_definition"
          test "$service_task_definition" != "None"

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION_FAMILY" \
            --query taskDefinition \
            --output json > base-task-definition.json

          base_task_definition="$(jq -r '.taskDefinitionArn' base-task-definition.json)"
          test -n "$base_task_definition"
          test "$base_task_definition" != "null"
          test "$(jq -r '.status' base-task-definition.json)" = "ACTIVE"
          test "$(jq -r '.family' base-task-definition.json)" = "$ECS_TASK_DEFINITION_FAMILY"

          service_task_definition_family="${service_task_definition##*/}"
          service_task_definition_family="${service_task_definition_family%:*}"
          test "$service_task_definition_family" = "$ECS_TASK_DEFINITION_FAMILY"

          container_count="$(jq --arg name "$ECS_CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $name)] | length' \
            base-task-definition.json)"
          test "$container_count" = "1"

          jq --arg name "$ECS_CONTAINER_NAME" --arg image "$IMAGE_URI" '
            .containerDefinitions |= map(
              if .name == $name then .image = $image else . end
            )
            | del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
          ' base-task-definition.json > next-task-definition.json

          jq -e --arg name "$ECS_CONTAINER_NAME" --arg image "$IMAGE_URI" \
            --slurpfile next next-task-definition.json '
              def register_input:
                del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy,
                  .deregisteredAt
                );
              (register_input | .containerDefinitions |= map(
                if .name == $name then .image = $image else . end
              )) == $next[0]
            ' base-task-definition.json >/dev/null

          target_task_definition="$(aws ecs register-task-definition \
            --cli-input-json file://next-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=${target_task_definition}" >> "$GITHUB_OUTPUT"
          {
            echo "Deployment target: ${DEPLOYMENT_TARGET}"
            echo "Base task definition (latest ACTIVE): ${base_task_definition}"
            echo "Target task definition: ${target_task_definition}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy and verify target revision
        env:
          IMAGE_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'infrastructure' && steps.manual-image.outputs.uri || steps.source-image.outputs.uri }}
          TARGET_TASK_DEFINITION: ${{ steps.task-definition.outputs.arn }}
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TARGET_TASK_DEFINITION" >/dev/null

          waiter_status=0
          if aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"; then
            :
          else
            waiter_status=$?
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].{taskDefinition:taskDefinition,deployments:deployments,events:events[0:10]}' \
              --output json
            echo "ECS waiter exited with ${waiter_status}; continuing bounded rollout verification." >&2
          fi

          ECS_DEPLOYMENT_VERIFY_ATTEMPTS=12 \
          ECS_DEPLOYMENT_VERIFY_INTERVAL_SECONDS=5 \
          bash scripts/verify-ecs-deployment.sh

          service_state="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0]' \
            --output json)"
          actual_task_definition="$(jq -r '.taskDefinition' <<< "$service_state")"
          primary_rollout_state="$(jq -r '
            [.deployments[] | select(.status == "PRIMARY") | .rolloutState] | first // empty
          ' <<< "$service_state")"

          echo "$service_state" | jq '{taskDefinition, deployments, events: .events[0:10]}'
          {
            echo "Deployment mode: ${DEPLOYMENT_MODE}"
            if [[ "$DEPLOYMENT_MODE" == *"-source" ]]; then
              echo "Commit: ${IMAGE_TAG}"
            else
              echo "Image source: current ECS Service"
            fi
            echo "Image: ${IMAGE_URI}"
            echo "Target task definition: ${TARGET_TASK_DEFINITION}"
            echo "Service task definition after stabilization: ${actual_task_definition}"
            echo "Primary rollout state: ${primary_rollout_state}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$actual_task_definition" != "$TARGET_TASK_DEFINITION" \
            || "$primary_rollout_state" != "COMPLETED" ]]; then
            echo "ECS deployment verification returned an inconsistent final state for ${TARGET_TASK_DEFINITION}." >&2
            exit 1
          fi
