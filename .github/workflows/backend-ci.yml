name: Backend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: detect verification scope
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      verification_required: ${{ steps.scope.outputs.verification_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect verification scope
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE" =~ ^0+$ ]] || ! git diff --quiet "$BASE" "$HEAD" -- \
            src/ build.gradle settings.gradle gradle/ gradlew gradlew.bat qodana.yaml \
            .github/workflows/backend-ci.yml scripts/test-backend-ci-branch-policy.sh; then
            echo 'verification_required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'verification_required=false' >> "$GITHUB_OUTPUT"
          fi

  workflow_tests:
    name: workflow tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Backend CI branch and deployment policy
        shell: bash
        run: bash scripts/test-backend-ci-branch-policy.sh

  test_fast:
    name: testFast
    needs: changes
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' &&
        needs.changes.outputs.verification_required == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run testFast
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          ./gradlew clean testFast --no-daemon
          elapsed=$(( $(date +%s) - started_at ))
          {
            echo "### testFast"
            echo "- Gradle dependency cache hit: ${{ steps.java.outputs.cache-hit }}"
            echo "- Elapsed seconds: ${elapsed}"
          } >> "$GITHUB_STEP_SUMMARY"

  integration_test:
    name: integrationTest
    needs: changes
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' &&
        needs.changes.outputs.verification_required == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Record Docker/Testcontainers environment
        shell: bash
        run: |
          set -euo pipefail
          docker info --format 'Docker server: {{.ServerVersion}}' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Docker images available before tests: $(docker images -q | wc -l)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run integrationTest
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          ./gradlew clean integrationTest --no-daemon
          elapsed=$(( $(date +%s) - started_at ))
          {
            echo "### integrationTest"
            echo "- Gradle dependency cache hit: ${{ steps.java.outputs.cache-hit }}"
            echo "- Elapsed seconds, including Testcontainers image preparation: ${elapsed}"
            echo "- Docker images available after tests: $(docker images -q | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: bootJar
    needs: changes
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' &&
        needs.changes.outputs.verification_required == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build executable JAR
        shell: bash
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          ./gradlew clean bootJar --no-daemon
          elapsed=$(( $(date +%s) - started_at ))
          {
            echo "### bootJar"
            echo "- Gradle dependency cache hit: ${{ steps.java.outputs.cache-hit }}"
            echo "- Elapsed seconds: ${elapsed}"
          } >> "$GITHUB_STEP_SUMMARY"

  qodana:
    name: Qodana PR changes
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.verification_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run Qodana for PR changes
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --linter qodana-jvm-community --within-docker true
          pr-mode: true
          post-pr-comment: false
          use-annotations: false
          upload-result: true
      - name: Summarize Qodana PR findings
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/qodana/results/qodana.sarif.json"
          test -s "$report"
          findings="$(jq '[.runs[]?.results[]?] | length' "$report")"
          types="$(jq -r '
            [
              .runs[] as $run | $run.results[]? |
              {
                id: (.ruleId // "unknown"),
                name: (
                  (if (.ruleIndex | type) == "number" then
                    $run.tool.driver.rules[.ruleIndex].shortDescription.text
                  else null end)
                  // .ruleId // "unknown"
                )
              }
            ]
            | group_by(.id)
            | map({name: .[0].name, count: length})
            | sort_by(-.count, .name)
            | .[:10][]
            | "- \(.name): \(.count)"
          ' "$report")"
          {
            echo '### Qodana JVM Community — PR changes'
            echo '- Mode: pull-request incremental analysis'
            echo "- Findings in changed files: ${findings}"
            echo '- Most frequent finding types:'
            if [[ -n "$types" ]]; then
              echo "$types"
            else
              echo '  - none'
            fi
            echo '- Detailed SARIF/HTML report: `qodana-report` workflow artifact'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  spotbugs:
    name: SpotBugs PR changed classes
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.verification_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Resolve changed Java classes
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE" "$HEAD" -- src/main/java src/test/java               | grep -E '^src/(main|test)/java/.+\.java$' || true
          )

          main_classes=()
          test_classes=()

          for file in "${files[@]}"; do
            case "${file##*/}" in
              package-info.java|module-info.java)
                continue
                ;;
            esac

            if [[ "$file" == src/main/java/* ]]; then
              class_name="${file#src/main/java/}"
              class_name="${class_name%.java}"
              class_name="${class_name//\//.}"
              main_classes+=("${class_name}*")
            elif [[ "$file" == src/test/java/* ]]; then
              class_name="${file#src/test/java/}"
              class_name="${class_name%.java}"
              class_name="${class_name//\//.}"
              test_classes+=("${class_name}*")
            fi
          done

          join_by_comma() {
            local IFS=,
            echo "$*"
          }

          main_filter="$(join_by_comma "${main_classes[@]}")"
          test_filter="$(join_by_comma "${test_classes[@]}")"
          main_count="${#main_classes[@]}"
          test_count="${#test_classes[@]}"
          total_count="$((main_count + test_count))"

          {
            echo "main_filter=${main_filter}"
            echo "test_filter=${test_filter}"
            echo "main_count=${main_count}"
            echo "test_count=${test_count}"
            echo "total_count=${total_count}"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### SpotBugs PR scope'
            echo "- Changed main classes: ${main_count}"
            echo "- Changed test classes: ${test_count}"
            echo "- Total changed Java classes: ${total_count}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run SpotBugs for changed classes
        if: steps.changed.outputs.total_count != '0'
        env:
          SPOTBUGS_MAIN_ONLY_ANALYZE: ${{ steps.changed.outputs.main_filter }}
          SPOTBUGS_TEST_ONLY_ANALYZE: ${{ steps.changed.outputs.test_filter }}
          MAIN_COUNT: ${{ steps.changed.outputs.main_count }}
          TEST_COUNT: ${{ steps.changed.outputs.test_count }}
        shell: bash
        run: |
          set -euo pipefail
          tasks=()
          if [[ "$MAIN_COUNT" != "0" ]]; then
            tasks+=(spotbugsMain)
          fi
          if [[ "$TEST_COUNT" != "0" ]]; then
            tasks+=(spotbugsTest)
          fi
          ./gradlew "${tasks[@]}" --no-daemon

      - name: Summarize SpotBugs PR findings
        if: always()
        env:
          MAIN_COUNT: ${{ steps.changed.outputs.main_count }}
          TEST_COUNT: ${{ steps.changed.outputs.test_count }}
          TOTAL_COUNT: ${{ steps.changed.outputs.total_count }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree
          import os

          main_count = int(os.environ.get('MAIN_COUNT') or 0)
          test_count = int(os.environ.get('TEST_COUNT') or 0)
          total_count = int(os.environ.get('TOTAL_COUNT') or 0)

          print('### SpotBugs — PR changed classes')
          print('- Mode: changed-class analysis via onlyAnalyze')
          print(f'- Changed main classes: {main_count}')
          print(f'- Changed test classes: {test_count}')

          if total_count == 0:
              print('- No changed Java classes; SpotBugs analysis skipped without falling back to a full scan.')
              raise SystemExit(0)

          reports = sorted(Path('build/reports/spotbugs').rglob('*.xml'))
          if not reports:
              raise SystemExit('SpotBugs was requested but produced no XML reports')

          finding_types = Counter()
          total_findings = 0
          for report in reports:
              bug_instances = list(ElementTree.parse(report).iter('BugInstance'))
              count = len(bug_instances)
              total_findings += count
              print(f'- {report}: {count} findings')
              for bug in bug_instances:
                  bug_type = bug.get('type', 'UNKNOWN')
                  short_message = (bug.findtext('ShortMessage') or '').strip()
                  label = f'{bug_type}: {short_message}' if short_message else bug_type
                  finding_types[label] += 1

          print(f'- Findings in analyzed changed classes: {total_findings}')
          print('- Most frequent finding types:')
          if finding_types:
              for label, count in finding_types.most_common(10):
                  print(f'  - {label}: {count}')
          else:
              print('  - none')
          print('- Detailed HTML/XML reports: `spotbugs-reports` workflow artifact')
          PY

      - name: Upload SpotBugs PR reports
        if: steps.changed.outputs.total_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: build/reports/spotbugs/
          if-no-files-found: error
          retention-days: 14

  verify:
    name: verify
    needs: [changes, test_fast, integration_test, package]
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' &&
        needs.changes.outputs.verification_required == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to pass
        env:
          TEST_FAST_RESULT: ${{ needs.test_fast.result }}
          INTEGRATION_TEST_RESULT: ${{ needs.integration_test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          test "$TEST_FAST_RESULT" = success
          test "$INTEGRATION_TEST_RESULT" = success
          test "$PACKAGE_RESULT" = success
          {
            echo "### verification aggregate"
            echo "- testFast: ${TEST_FAST_RESULT}"
            echo "- integrationTest: ${INTEGRATION_TEST_RESULT}"
            echo "- bootJar: ${PACKAGE_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
