name: OpenAPI contract

on:
  pull_request:
    paths:
      - docs/api/openapi.yaml
      - scripts/verify-openapi-nullable-enums.mjs
      - .github/workflows/openapi-contract.yml
  push:
    paths:
      - docs/api/openapi.yaml
      - scripts/verify-openapi-nullable-enums.mjs
      - .github/workflows/openapi-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint docs/api/openapi.yaml
      - name: Verify nullable enum variants
        run: node scripts/verify-openapi-nullable-enums.mjs docs/api/openapi.yaml
      - name: Verify MVP operation count
        run: |
          count=$(grep -Ec '^    (get|post|put|patch|delete):' docs/api/openapi.yaml)
          test "$count" -eq 20
