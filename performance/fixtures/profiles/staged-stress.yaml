# Synthetic validation fixture; values are not an operational preset.
test:
  id: FIXTURE-STAGED-STRESS
  name: synthetic staged stress validation
  type: STRESS
workload:
  concurrent_test_runs: 3
  stages:
  - duration_seconds: 1
    concurrent_test_runs: 1
  - duration_seconds: 1
    concurrent_test_runs: 2
  - duration_seconds: 1
    concurrent_test_runs: 3
  - duration_seconds: 1
    concurrent_test_runs: 1
  - duration_seconds: 1
    concurrent_test_runs: 0
  max_iterations_per_vu: 0
  completion_timeout_seconds: 2
  polling_interval_seconds: 0.1
target:
  type: HTTP_ENDPOINT
  identifier: http://127.0.0.1:18080/v1/chat/completions
  model: fixture-model
  revision: fixture-v1
acceptance:
  api:
    create_latency_ms:
      p50: 1000
      p95: 2000
      p99: 3000
    error_rate: 0
  completion:
    max_seconds: 2
    failure_rate: 0
    queue_drain_seconds: 2
    dlq_messages: 0
