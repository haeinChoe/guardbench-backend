# Resource names are deployment inputs, not workload/profile inputs.
# ECS/RDS/SageMaker dimensions are bound from the experiment manifest's
# infrastructure.expected; SQS QueueName dimensions remain environment inputs.
# validate_configuration() blocks a run when any dimension stays empty.
metrics:
  - id: ecs_cpu_utilization
    namespace: AWS/ECS
    metric_name: CPUUtilization
    statistic: Average
    period_seconds: 60
    dimensions:
      ClusterName: ""
      ServiceName: ""
  - id: ecs_memory_utilization
    namespace: AWS/ECS
    metric_name: MemoryUtilization
    statistic: Average
    period_seconds: 60
    dimensions:
      ClusterName: ""
      ServiceName: ""
  - id: ecs_running_task_count
    namespace: ECS/ContainerInsights
    metric_name: RunningTaskCount
    statistic: Average
    period_seconds: 60
    dimensions:
      ClusterName: ""
      ServiceName: ""
  - id: sqs_resolve_visible
    namespace: AWS/SQS
    metric_name: ApproximateNumberOfMessagesVisible
    statistic: Average
    period_seconds: 60
    dimensions:
      QueueName: "${PERF_SOURCE_QUEUE_RESOLVE_NAME}"
  - id: sqs_workitems_visible
    namespace: AWS/SQS
    metric_name: ApproximateNumberOfMessagesVisible
    statistic: Average
    period_seconds: 60
    dimensions:
      QueueName: "${PERF_SOURCE_QUEUE_WORK_ITEMS_NAME}"
  - id: sqs_finalize_visible
    namespace: AWS/SQS
    metric_name: ApproximateNumberOfMessagesVisible
    statistic: Average
    period_seconds: 60
    dimensions:
      QueueName: "${PERF_SOURCE_QUEUE_FINALIZE_NAME}"
  - id: sqs_resolve_oldest_age
    namespace: AWS/SQS
    metric_name: ApproximateAgeOfOldestMessage
    statistic: Maximum
    period_seconds: 60
    dimensions:
      QueueName: "${PERF_SOURCE_QUEUE_RESOLVE_NAME}"
  - id: sqs_workitems_oldest_age
    namespace: AWS/SQS
    metric_name: ApproximateAgeOfOldestMessage
    statistic: Maximum
    period_seconds: 60
    dimensions:
      QueueName: "${PERF_SOURCE_QUEUE_WORK_ITEMS_NAME}"
  - id: sqs_finalize_oldest_age
    namespace: AWS/SQS
    metric_name: ApproximateAgeOfOldestMessage
    statistic: Maximum
    period_seconds: 60
    dimensions:
      QueueName: "${PERF_SOURCE_QUEUE_FINALIZE_NAME}"
  - id: sqs_resolve_dlq_visible
    namespace: AWS/SQS
    metric_name: ApproximateNumberOfMessagesVisible
    statistic: Average
    period_seconds: 60
    dimensions:
      QueueName: "${PERF_DLQ_RESOLVE_NAME}"
  - id: sqs_workitems_dlq_visible
    namespace: AWS/SQS
    metric_name: ApproximateNumberOfMessagesVisible
    statistic: Average
    period_seconds: 60
    dimensions:
      QueueName: "${PERF_DLQ_WORK_ITEMS_NAME}"
  - id: sqs_finalize_dlq_visible
    namespace: AWS/SQS
    metric_name: ApproximateNumberOfMessagesVisible
    statistic: Average
    period_seconds: 60
    dimensions:
      QueueName: "${PERF_DLQ_FINALIZE_NAME}"
  - id: rds_cpu_utilization
    namespace: AWS/RDS
    metric_name: CPUUtilization
    statistic: Average
    period_seconds: 60
    dimensions:
      DBInstanceIdentifier: ""
  - id: rds_database_connections
    namespace: AWS/RDS
    metric_name: DatabaseConnections
    statistic: Average
    period_seconds: 60
    dimensions:
      DBInstanceIdentifier: ""
  - id: sagemaker_invocations
    namespace: AWS/SageMaker
    metric_name: Invocations
    statistic: Sum
    period_seconds: 60
    dimensions:
      EndpointName: ""
      VariantName: ""
  - id: sagemaker_model_latency
    namespace: AWS/SageMaker
    metric_name: ModelLatency
    statistic: Average
    period_seconds: 60
    dimensions:
      EndpointName: ""
      VariantName: ""
  - id: sagemaker_overhead_latency
    namespace: AWS/SageMaker
    metric_name: OverheadLatency
    statistic: Average
    period_seconds: 60
    dimensions:
      EndpointName: ""
      VariantName: ""
  - id: sagemaker_invocation_4xx_errors
    namespace: AWS/SageMaker
    metric_name: Invocation4XXErrors
    statistic: Sum
    period_seconds: 60
    dimensions:
      EndpointName: ""
      VariantName: ""
  - id: sagemaker_invocation_5xx_errors
    namespace: AWS/SageMaker
    metric_name: Invocation5XXErrors
    statistic: Sum
    period_seconds: 60
    dimensions:
      EndpointName: ""
      VariantName: ""
